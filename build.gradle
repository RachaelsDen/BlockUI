plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
}

version = project.modVersion
group = project.modGroup

base {
    archivesName = project.modId
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

loom {
    accessWidenerPath = file('src/main/resources/blockui.accessWidener')
}

dependencies {
    minecraft "com.mojang:minecraft:${project.exactMinecraftVersion}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.parchmentMinecraftVersion}:${project.parchmentMappingsVersion}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${project.loaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabricVersion}+${project.minecraftVersion}"

    modImplementation(include("me.shedaniel.cloth:cloth-config-fabric:${project.clothConfigVersion}"))
    modLocalRuntime "maven.modrinth:AANobbMI:mc${project.exactMinecraftVersion}-${project.sodiumVersion}-fabric"

    testImplementation 'junit:junit:4.13.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.javaVersion as int)
    }

    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.javaVersion as int
}

sourceSets {
    main {
        java {
            // Blacklist mode: exclude only files with hard NeoForge dependencies
            // that require their dedicated follow-up port tasks.
            exclude 'com/ldtteam/common/fakelevel/**'
        }
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand(version: project.version)
    }
}

test {
    useJUnit()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
